# NSUT Attendance & Presence — production-style stack.
#   cp .env.example .env   (then set strong secrets)
#   docker compose up -d --build
#   docker compose --profile demo run --rm seed      # optional demo data (never on a live system)
#   docker compose --profile proxy up -d             # optional Nginx TLS reverse proxy
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nsut_attendance}
      POSTGRES_USER: ${POSTGRES_USER:-nsut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host: only the app can reach the database.

  app:
    build: .
    image: nsut-attendance:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nsut}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nsut_attendance}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      RECORD_CLIENT_META: ${RECORD_CLIENT_META:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_MODE: ${DEMO_MODE:-false}
      MIGRATE_ON_START: "true"
    volumes:
      - uploads:/app/uploads
    ports:
      - "${APP_PORT:-4000}:4000"

  seed:
    profiles: ["demo"]
    image: nsut-attendance:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nsut}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nsut_attendance}
      SESSION_SECRET: ${SESSION_SECRET}
      SEED_DEMO_DATA: "true"
    command: ["true"]

  backup:
    profiles: ["backup"]
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-nsut}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-nsut_attendance}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      # Mount OFF-HOST storage here (NFS / separate disk) — never the same disk as pgdata.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

  proxy:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./docker/certs}:/etc/nginx/certs:ro

volumes:
  pgdata:
  uploads:
